name: bizmatic

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      args:
        APP_UID: ${BIZMATIC_UID:-10001}
        APP_GID: ${BIZMATIC_GID:-10001}
    image: ${BIZMATIC_APP_IMAGE:-bizmatic-app:local}
    env_file:
      - path: ${BIZMATIC_ENV_FILE:-.env.docker}
        format: raw
    environment:
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ${BIZMATIC_DATABASE_FILE:?Run bizmatic init to choose your SQLite file}
      DB_SQLITE_TIMEOUT_SECONDS: "30"
      LOCAL_FILE_STORAGE_PATH: ${BIZMATIC_UPLOADS_DIR:?Run bizmatic init to choose uploads storage}
      DB_EXTRACTION_CREDENTIAL_KEY_FILE: ${BIZMATIC_KEY_DIR:?Run bizmatic init to choose key storage}/db-extraction.key
      BIZMATIC_LOAD_PROJECT_ENV: "false"
      BIZMATIC_DEV_MODE: "false"
      DJANGO_TRUST_PROXY: "true"
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-600}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: bind
        source: ${BIZMATIC_DATA_DIR:?Run bizmatic init}
        target: ${BIZMATIC_DATA_DIR}
        bind:
          create_host_path: false
      - type: bind
        source: ${BIZMATIC_UPLOADS_DIR:?Run bizmatic init}
        target: ${BIZMATIC_UPLOADS_DIR}
        bind:
          create_host_path: false
      - type: bind
        source: ${BIZMATIC_KEY_DIR:?Run bizmatic init}
        target: ${BIZMATIC_KEY_DIR}
        bind:
          create_host_path: false
      - static:/app/staticfiles
    healthcheck:
      test: [CMD, python, /app/deploy/healthcheck.py]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
    cpus: ${APP_CPUS:-2.0}
    pids_limit: 256
    stop_grace_period: 660s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *logging

  proxy:
    build:
      context: ./deploy/nginx
    image: ${BIZMATIC_PROXY_IMAGE:-bizmatic-proxy:local}
    environment:
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-600}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-128m}
      STATIC_CACHE_TTL: ${STATIC_CACHE_TTL:-1h}
      STATIC_CACHE_CONTROL: ""
    ports:
      - "${BIZMATIC_BIND_ADDRESS:-127.0.0.1}:${BIZMATIC_PORT:-8005}:8080"
    volumes:
      - static:/srv/static:ro
    depends_on:
      app:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz/]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.6}
    profiles: [ollama]
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    logging: *logging

volumes:
  static:
  ollama_models:
