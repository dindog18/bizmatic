{% load static %}
{{ page_guide|json_script:'page-tour-data' }}
<dialog id="help-tour" class="help-tour" aria-labelledby="help-tour-title" aria-describedby="help-tour-text">
  <div class="help-tour-highlight" aria-hidden="true"></div>
  <div class="help-tour-card">
    <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
      <span id="help-tour-progress" class="fs-10 text-700" aria-live="polite"></span>
      <button type="button" class="btn-close p-2" id="help-tour-close" aria-label="Close help"></button>
    </div>
    <h2 id="help-tour-title" class="fs-8 mb-2"></h2>
    <p id="help-tour-text" class="fs-9 text-700 mb-3"></p>
    <div class="d-flex justify-content-between gap-2">
      <button type="button" class="btn btn-sm btn-outline-primary" id="help-tour-back">Back</button>
      <button type="button" class="btn btn-sm btn-primary" id="help-tour-next">Next</button>
    </div>
  </div>
</dialog>
<script src="{% static 'document_extraction/help-tour.js' %}?v=1" defer></script>
