<nav class="d-flex gap-3 my-3" aria-label="Pagination">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&amp;status={{ request.GET.status|urlencode }}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&amp;status={{ request.GET.status|urlencode }}">Next</a>{% endif %}</nav>
