name: Django checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ":memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check Django configuration
        run: python bizmatic_django/manage.py check
      - name: Check for missing migrations
        run: python bizmatic_django/manage.py makemigrations --check --dry-run
      - name: Run tests
        working-directory: bizmatic_django
        run: python manage.py test --noinput

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frontend regression tests
        run: node --test bizmatic_django/accounts_receivable/frontend_tests/*.test.cjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated test configuration
        run: python3 deploy/configure.py --port 18005
      - name: Build and start the complete stack
        run: ./deploy/compose -p bizmatic-ci up -d --build --wait --wait-timeout 180
      - name: Full Django suite on PostgreSQL
        run: ./deploy/compose -p bizmatic-ci exec -T app python manage.py test --noinput
      - name: Test routes, MIME types and CSRF-protected extraction
        run: python3 deploy/smoke.py --base-url http://127.0.0.1:18005 --write-fixture
      - name: Verify restart, encrypted credentials and persistent originals
        run: |
          ./deploy/compose -p bizmatic-ci exec -T app python manage.py shell -c 'from db_extraction.models import DatabaseSource; DatabaseSource.objects.create(name="ci-key-check", host="fixture.invalid", database_name="fixture", username="reader", password="synthetic-ci-password")'
          ./deploy/compose -p bizmatic-ci restart app
          ./deploy/compose -p bizmatic-ci up -d --wait --wait-timeout 180
          python3 deploy/smoke.py --base-url http://127.0.0.1:18005
          ./deploy/compose -p bizmatic-ci exec -T app python manage.py shell -c 'from db_extraction.models import DatabaseSource; assert DatabaseSource.objects.get(name="ci-key-check").password == "synthetic-ci-password"'
          curl --fail http://127.0.0.1:18005/documents/1/original/ | grep 'Bizmatic Docker smoke fixture'
      - name: Container logs on failure
        if: failure()
        run: ./deploy/compose -p bizmatic-ci logs --tail 100 app proxy db
      - name: Remove disposable CI stack
        if: always()
        run: ./deploy/compose -p bizmatic-ci down -v --remove-orphans
