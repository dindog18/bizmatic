name: Django checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ":memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: CLI regression tests
        run: python -m unittest deploy.test_cli
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check Django configuration
        run: python bizmatic_django/manage.py check
      - name: Check for missing migrations
        run: python bizmatic_django/manage.py makemigrations --check --dry-run
      - name: Run tests
        working-directory: bizmatic_django
        run: python manage.py test --noinput

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frontend regression tests
        run: node --test bizmatic_django/accounts_receivable/frontend_tests/*.test.cjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Generate user-owned test storage and configuration
        run: ./bizmatic init --yes --database ${{ matrix.database }} --port 18005
      - name: Build and start through the user CLI
        run: ./bizmatic --project-name bizmatic-ci start --wait-timeout 180
      - name: Full Django suite in Docker
        run: ./bizmatic --project-name bizmatic-ci manage test --noinput
      - name: Test routes, MIME types and CSRF-protected extraction
        run: python3 deploy/smoke.py --base-url http://127.0.0.1:18005 --write-fixture
      - name: Verify restart, encrypted credentials and persistent originals
        run: |
          ./bizmatic --project-name bizmatic-ci manage shell -c 'from db_extraction.models import DatabaseSource; DatabaseSource.objects.create(name="ci-key-check", host="fixture.invalid", database_name="fixture", username="reader", password="synthetic-ci-password")'
          ./bizmatic --project-name bizmatic-ci compose -- restart app
          ./bizmatic --project-name bizmatic-ci start --no-build --wait-timeout 180
          python3 deploy/smoke.py --base-url http://127.0.0.1:18005
          ./bizmatic --project-name bizmatic-ci manage shell -c 'from db_extraction.models import DatabaseSource; assert DatabaseSource.objects.get(name="ci-key-check").password == "synthetic-ci-password"'
          curl --fail http://127.0.0.1:18005/documents/1/original/ | grep 'Bizmatic Docker smoke fixture'
      - name: Verify live UI and backend development reload
        if: matrix.database == 'sqlite'
        run: |
          ./bizmatic --project-name bizmatic-ci start --dev --no-build --wait-timeout 180
          python3 deploy/check_reload.py --base-url http://127.0.0.1:18005 --allow-source-edits
      - name: Container logs on failure
        if: failure()
        run: ./bizmatic --project-name bizmatic-ci logs --tail 100
      - name: Remove disposable CI containers and caches
        if: always()
        run: ./bizmatic --project-name bizmatic-ci compose -- down -v --remove-orphans
