name: Django checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ":memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check Django configuration
        run: python bizmatic_django/manage.py check
      - name: Check for missing migrations
        run: python bizmatic_django/manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python bizmatic_django/manage.py test document_extraction --noinput
